<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" width="560" height="404" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">SyncSeries 공통 기반 및 모듈 연동 아키텍처</title>
  <desc id="arch-desc">SyncBoot 공통 기반 위에 구성된 주력 솔루션 4종(SyncVerse, SyncETA, SyncBoot, SyncCMS)과 확장 모듈 7종이 표준 REST 및 MCP 규격으로 연동되는 구조도</desc>
  <defs>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <style>
      .sans { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Blueprint Card -->
  <rect x="8" y="8" width="544" height="388" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Top Header Strip -->
  <rect x="8" y="8" width="544" height="40" rx="14" fill="#F8FAFC"/>
  <rect x="8" y="34" width="544" height="14" fill="#F8FAFC"/>
  <line x1="8" y1="48" x2="552" y2="48" stroke="#E2E8F0" stroke-width="1"/>

  <circle cx="28" cy="28" r="4" fill="#0891B2"/>
  <text x="40" y="32" class="mono" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="0.06em">SYNCSERIES ARCHITECTURE</text>

  <rect x="434" y="18" width="102" height="20" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1"/>
  <text x="485" y="31.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#0E7490">REST · MCP</text>

  <!-- Layer 1 Label: Flagship Solutions -->
  <text x="26" y="72" class="mono" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.05em">FLAGSHIP SOLUTIONS (주력 솔루션 4종)</text>

  <!-- 4 Flagship Cards -->
  <!-- 1. SyncVerse -->
  <rect x="24" y="82" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
  <rect x="24" y="82" width="122" height="4" rx="2" fill="#0891B2"/>
  <text x="36" y="108" class="sans" font-size="13" font-weight="700" fill="#0F172A">SyncVerse</text>
  <text x="36" y="125" class="sans" font-size="10.5" fill="#475569">협업 · 승인 통합 관제</text>
  <text x="36" y="139" class="mono" font-size="9" fill="#0891B2">Control Tower</text>

  <!-- 2. SyncETA -->
  <rect x="154" y="82" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="166" y="108" class="sans" font-size="13" font-weight="700" fill="#0F172A">SyncETA</text>
  <text x="166" y="125" class="sans" font-size="10.5" fill="#475569">자동 E2E 테스트</text>
  <text x="166" y="139" class="mono" font-size="9" fill="#64748B">QA Automation</text>

  <!-- 3. SyncBoot -->
  <rect x="284" y="82" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="296" y="108" class="sans" font-size="13" font-weight="700" fill="#0F172A">SyncBoot</text>
  <text x="296" y="125" class="sans" font-size="10.5" fill="#475569">기업 업무 시스템 기반</text>
  <text x="296" y="139" class="mono" font-size="9" fill="#64748B">Backend Core</text>

  <!-- 4. SyncCMS -->
  <rect x="414" y="82" width="122" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="426" y="108" class="sans" font-size="13" font-weight="700" fill="#0F172A">SyncCMS</text>
  <text x="426" y="125" class="sans" font-size="10.5" fill="#475569">웹사이트 · 다국어</text>
  <text x="426" y="139" class="mono" font-size="9" fill="#64748B">Headless CMS</text>

  <!-- Connectors Top -> Protocol Bus -->
  <g stroke="#94A3B8" stroke-width="1.2">
    <line x1="85" y1="148" x2="85" y2="170" stroke="#0891B2" stroke-width="1.5"/>
    <line x1="215" y1="148" x2="215" y2="170"/>
    <line x1="345" y1="148" x2="345" y2="170"/>
    <line x1="475" y1="148" x2="475" y2="170"/>
  </g>
  <circle cx="85" cy="170" r="3" fill="#0891B2"/>
  <circle cx="215" cy="170" r="2.5" fill="#64748B"/>
  <circle cx="345" cy="170" r="2.5" fill="#64748B"/>
  <circle cx="475" cy="170" r="2.5" fill="#64748B"/>

  <!-- Protocol Bus -->
  <rect x="24" y="170" width="512" height="30" rx="6" fill="#F8FAFC" stroke="#0891B2" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="280" y="189" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#0E7490">Standard REST (/api/v1/*)  ·  MCP REST/SSE  ·  RBAC · Audit Trail</text>

  <!-- Connectors Bus -> Extension Modules -->
  <g stroke="#94A3B8" stroke-width="1.2">
    <line x1="138" y1="200" x2="138" y2="222"/>
    <line x1="398" y1="200" x2="398" y2="222"/>
  </g>
  <circle cx="138" cy="222" r="2.5" fill="#64748B"/>
  <circle cx="398" cy="222" r="2.5" fill="#64748B"/>

  <!-- Layer 2: Extension Modules (7 Modules) -->
  <text x="26" y="216" class="mono" font-size="9.5" font-weight="700" fill="#475569" letter-spacing="0.05em">EXTENSION MODULES (확장 모듈 7종)</text>

  <!-- Left Group: Data & AI (3) -->
  <rect x="24" y="222" width="232" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="36" y="240" class="sans" font-size="10.5" font-weight="700" fill="#475569">데이터 · AI 확장 (3종)</text>

  <rect x="34" y="249" width="68" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="264" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#0F172A">SyncInsight</text>
  <text x="68" y="277" text-anchor="middle" class="sans" font-size="9" fill="#64748B">NL2SQL</text>

  <rect x="106" y="249" width="68" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="140" y="264" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#0F172A">SyncLLM</text>
  <text x="140" y="277" text-anchor="middle" class="sans" font-size="9" fill="#64748B">AI 게이트웨이</text>

  <rect x="178" y="249" width="68" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="212" y="264" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#0F172A">SyncCrawl</text>
  <text x="212" y="277" text-anchor="middle" class="sans" font-size="9" fill="#64748B">웹 수집·RAG</text>

  <!-- Right Group: Security & Domain (4) -->
  <rect x="266" y="222" width="270" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="278" y="240" class="sans" font-size="10.5" font-weight="700" fill="#475569">보안 · 업무 확장 (4종)</text>

  <rect x="274" y="249" width="61" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="304.5" y="264" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0F172A">SyncAPIM</text>
  <text x="304.5" y="277" text-anchor="middle" class="sans" font-size="8.5" fill="#64748B">API 보안</text>

  <rect x="339" y="249" width="61" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="369.5" y="264" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0F172A">SyncWatch</text>
  <text x="369.5" y="277" text-anchor="middle" class="sans" font-size="8.5" fill="#64748B">취약점 관제</text>

  <rect x="404" y="249" width="61" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="434.5" y="264" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0F172A">SyncShop</text>
  <text x="434.5" y="277" text-anchor="middle" class="sans" font-size="8.5" fill="#64748B">커머스 MSA</text>

  <rect x="469" y="249" width="61" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="499.5" y="264" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0F172A">SyncOps</text>
  <text x="499.5" y="277" text-anchor="middle" class="sans" font-size="8.5" fill="#64748B">SI 손익</text>

  <!-- Connectors Extension -> Foundation -->
  <g stroke="#94A3B8" stroke-width="1.2">
    <line x1="138" y1="294" x2="138" y2="314"/>
    <line x1="280" y1="294" x2="280" y2="314" stroke="#0891B2" stroke-width="1.5"/>
    <line x1="398" y1="294" x2="398" y2="314"/>
  </g>

  <!-- Layer 3: Common Foundation (Dark Slate Anchor) -->
  <rect x="24" y="314" width="512" height="66" rx="10" fill="#0F172A"/>
  <rect x="38" y="328" width="6" height="38" rx="3" fill="#0891B2"/>
  <text x="54" y="343" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">SyncBoot Common Foundation &amp; Shared Modules</text>
  <text x="54" y="361" class="mono" font-size="10" fill="#CBD5E1">Java 25 · Spring Boot 4.0 · PostgreSQL 18.6 (pgvector) · Redis 7</text>

  <rect x="426" y="328" width="96" height="17" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="474" y="339.5" text-anchor="middle" class="mono" font-size="9" fill="#38BDF8">sync-core</text>

  <rect x="426" y="349" width="96" height="17" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="474" y="360.5" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">sync-module-*</text>
</svg>
